name = "sync"
description = "Nightly sync: clone and fast-forward the repos you list through git, then run hooks other modules register"
platforms = ["mac", "linux"]
requires = []

[prerequisites]
all = ["git", "python3"]
linux = ["systemctl"]
mac = ["launchctl"]

# Every setting this module reads, with its default. Override any of them
# in estate.toml under [modules.sync]; an unlisted key is an error.
[defaults]
repos_file = "~/.config/agent-estate/sync-repos.tsv"  # the repo table (TSV), see README
hooks = []     # shell commands run in order after the repo table, e.g. ["estate-config-sync apply --pull"]
hour = 4       # local time the timer fires, 0-23
minute = 0     # 0-59
