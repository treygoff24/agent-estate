name = "health"
description = "Hourly read-only health report: disk, memory, failed units, doctor, sync, runaway processes, stale worktrees"
platforms = ["mac", "linux"]
requires = []

[prerequisites]
all = ["python3", "git"]
linux = ["systemctl"]
mac = ["launchctl"]

# Every setting this module reads, with its default. Override in estate.toml
# under [modules.health]; an unlisted key is an error.
[defaults]
disk_warn = 85          # percent of the home volume used
disk_crit = 95
mem_warn = 85           # percent of memory in use (excluding reclaimable cache)
mem_crit = 95
runaway_cpu = 80        # a process averaging at least this % of a core ...
runaway_minutes = 30    # ... for at least this many minutes is reported
worktree_days = 14      # a git worktree untouched this long is stale
