[Unit]
Description=agent test and build runs (testrun): one shared memory ceiling, CPU by weight

[Slice]
# No CPU quota: a lone run may use every core, and under contention CPU is shared
# by weight. A quota is not work-conserving and stalls every task in the cgroup
# for the rest of its period, which times out timing-sensitive tests.
CPUWeight=${modules.guardrails.cpu_weight}
MemoryHigh=${modules.guardrails.memory_high}
# Hard ceiling: MemoryHigh only throttles. Past MemoryMax the kernel kills inside
# this slice, instead of the whole machine going out of memory.
MemoryMax=${modules.guardrails.memory_max}
